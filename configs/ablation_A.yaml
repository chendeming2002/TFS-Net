seed: 42
output_dir: outputs/sdsd_ablation_A
dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root: /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root: /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 8
model:
  type: TFSNet
  in_channels: 3
  level_channels: [32, 64, 96]
  fused_channels: 64
train:
  batch_size: 2
  epochs: 30
  lr: 0.0008
  weight_decay: 0.0001
  amp: false
  log_interval: 50
  val_interval: 5
  warmup_epochs: 5
  grad_clip: 0.5
loss:
  type: TFSNetLoss
  use_freq_loss: true
  perceptual_pretrained: true
  lambda_perc: 0.2
  lambda_freq: 0.1
  lambda_illum: 0.01
  lambda_ssim: 0.1
  lambda_inter: 0.3
  fused_channels: 64
eval:
  tile_size: 256
  tile_overlap: 32
  amp: false
