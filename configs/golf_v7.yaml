seed: 42
output_dir: outputs/golf_v7

dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root: /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root: /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 0
  max_val_seqs: 5
  val_crop_size: 256

model:
  type: GolfNet_v7
  num_frames: 5
  encoder_channels: [32, 64, 128]
  feature_dim: 128
  rwkv_heads: 8
  rwkv_blocks: 2
  adaptive_decay: true

train:
  batch_size: 2
  epochs: 60
  lr: 0.0006
  weight_decay: 0.0001
  amp: true
  amp_dtype: fp16
  log_interval: 10
  val_interval: 10
  warmup_epochs: 5
  grad_clip: 0.5
  grad_accum_steps: 1

loss:
  type: SimpleLoss
  lambda_base: 1.0
  use_ssim: true
  ssim_weight: 0.3

eval:
  tile_size: 256
  tile_overlap: 32
  amp: false
