## v8 U-Net 式重构: SpatialSummary + TripleQueryTCA 合并为编码器-解码器结构 (15 epoch)
##
## 结构 (详见 docs/v8/05-UNet重构设计.md):
##   - 每层 RWKV 块改为**单模块循环 M 次** (参数不变, 计算 ×M), 不再堆 N 个独立 block
##   - SpatialSummary 改为 F3→F2→F1 的自上而下聚合, 帧间权重由时序 RWKV 给出
##   - TripleQueryTCA 移到 F1 尺度; N/L 用多帧聚合特征, M 用单帧旁路特征
##   - 删除 SpatialSummary 的池化 token 路径、PixelTemporalAttention、feature_proj、MatrixRWKVInjector
##   - 三分支在 F1 直接输出, 不再上采样
##
## 为什么融合用 additive 而不是 gated:
##   合并实验 (outputs/v8_combined_B1M1M2M3A) 显示 gated 模式下门 g 一路降到 0.000,
##   而 ∂O/∂Y_M = g, 门一关 M 路就再也拿不到梯度 —— 属于结构性自锁。
##   本次先验证新聚合结构本身, 用 additive 保证三路都有梯度。
##
## 判据: 三路输出的空间方差 (主判据, 常数图约 1e-9)、各自与目标的误差、消融代价。
seed: 42
output_dir: outputs/v8_unet_refactor_15ep
dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root: /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root: /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 6
  pairing: position
  branch_target_kernel_low: 31
  branch_target_kernel_high: 5
  branch_target_motion_share_mid: 0.5
  branch_target_motion_share_high: 0.2
model:
  arch: v8
  num_frames: 5
  encoder_channels:
  - 32
  - 64
  - 128
  encoder_loops: 2
  temporal_loops: 2
  spatial_head: v8
  wkv_mode: single_norm
  channel_mix_rate: 4
  use_omni_shift: true
  use_channel_mix: true
  lowpass_kernel: 9
  branch_blocks: 2
  fusion_mode: additive
  fusion_weight_floor: 0.1
  fusion_residual_freeze: true
  branch_m_single_frame: true
train:
  batch_size: 2
  epochs: 15
  lr: 0.0005657
  weight_decay: 0.01
  log_interval: 100
  val_interval: 5
  grad_clip: 1.0
  ckpt_interval: 500
  lpips_net: vgg
loss:
  w_branch_N: 0.3
  w_branch_L: 0.3
  w_branch_M: 0.3
  lambda_ortho: 0.01
  w_ssim: 0.0
  branch_warmup_epochs: 5
  use_lowfreq_L: false
  lowfreq_kernel: 16
  branch_specific_targets: true
  branch_target_normalize: true
