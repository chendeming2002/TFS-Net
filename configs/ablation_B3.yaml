seed: 42
output_dir: outputs/sdsd_ablation_B3
dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root: /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root: /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 8
model:
  type: TFSNet
  in_channels: 3
  level_channels: [32, 64, 96]
  fused_channels: 64
  use_soft_clamp: true
  sace_offset_use_norm: true
  sace_offset_kaiming_init: true
  use_soft_median: true
  use_nafblock: false
train:
  batch_size: 2
  epochs: 30
  lr: 0.0008
  weight_decay: 0.0001
  amp: false
  log_interval: 50
  val_interval: 5
  warmup_epochs: 5
  grad_clip: 0.5
loss:
  type: TFSNetLoss
  use_freq_loss: true
  perceptual_pretrained: true
  lambda_perc: 0.2
  lambda_freq: 0.1
  lambda_illum: 0.01
  lambda_ssim: 0.1
  lambda_inter: 0.3
  fused_channels: 64
  # 移除 s_illum/s_noise 显式监督
  lambda_illum_sup: 0.0
  lambda_noise_sup: 0.0
  # 移除多层 VGG 和频域相位 (回到 v5.5 损失)
  perc_multilayer: false
  freq_with_phase: false
eval:
  tile_size: 256
  tile_overlap: 32
  amp: false
