seed: 42
output_dir: outputs/golf_r2

dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root: /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root: /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 2
  max_val_seqs: 5
  val_crop_size: 256

model:
  type: GolfNet
  in_channels: 3
  num_frames: 5
  encoder_channels: [32, 64, 128]
  tca_channels: 128
  tca_heads: 4
  tca_num_blocks: 6
  branch_blocks: [3, 2, 3]
  fusion_blocks: 2
  gamma: 2.0

train:
  batch_size: 2
  epochs: 40
  lr: 0.0008
  weight_decay: 0.0001
  amp: true
  log_interval: 50
  val_interval: 10
  warmup_epochs: 5
  grad_clip: 0.5
  grad_accum_steps: 8

loss:
  type: GolfLoss
  lambda_N: 0.3
  lambda_L: 0.3
  lambda_M: 0.3
  lambda_ortho: 0.01
  lambda_temp: 0.02
  lambda_div: 0.05
  use_ssim: true
  ssim_weight: 0.3

eval:
  tile_size: 256
  tile_overlap: 32
  amp: false
