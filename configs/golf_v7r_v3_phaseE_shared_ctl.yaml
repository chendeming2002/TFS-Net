## Phase E 对照臂: 共享监督目标 (历史行为)
##
## 与 golf_v7r_v3_phaseE_branch_targets.yaml 构成受控 A/B, 唯一变量:
##   loss.branch_specific_targets = false  (三路都对同一张 GT 做 L1)
##
## 为什么需要这个对照而不直接复用 multiseed_ref_softmax_runs:
##   那组 run 跑在数据集加了 branch_targets 参数之前的代码上。虽然开关默认关闭、
##   __getitem__ 返回结构不变, 但为了让 A/B 落在【同一代码版本、同一数据加载路径】上,
##   对照臂必须重跑。这是 §6.14 的教训之一 —— 跨代码版本比较不可信。
seed: 42
output_dir: outputs/golf_v7r_v3_phaseE_shared_ctl

dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root: /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root: /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 0
  pairing: position
  branch_target_max_shift: 4
  branch_target_lowfreq_kernel: 31

model:
  fusion_mode: softmax
  num_frames: 5
  encoder_channels: [32, 64, 128]
  feature_dim: 128
  rwkv_dim: 192
  rwkv_heads: 6
  rwkv_head_size: 32
  rwkv_blocks: 2
  spatial_size: 2
  branch_channels: 128
  motion_aware_diff: false
  diff_smooth_kernel: 5

train:
  batch_size: 2
  epochs: 60
  lr: 0.0005657
  weight_decay: 0.01
  log_interval: 100
  val_interval: 5
  grad_clip: 1.0
  ckpt_interval: 500
  lpips_net: vgg

loss:
  w_branch_N: 0.1
  w_branch_L: 0.1
  w_branch_M: 0.1
  lambda_ortho: 0.01
  w_ssim: 0.0
  branch_warmup_epochs: 5
  use_lowfreq_L: false
  lowfreq_kernel: 16
  branch_specific_targets: false
