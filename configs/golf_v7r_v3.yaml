seed: 42
output_dir: outputs/golf_v7r_v3
# ⚠️ 历史 name 配对配置 (已被 position 配对取代, 见 golf_v7r_v3_pospair.yaml)
# outputs/golf_v7r_v3/ 目录已清理, 原 resume 路径失效, 故移除 resume。
# dataset 缺少 pairing 字段 → 默认 "name" (错位协议), 仅作历史参考, 勿用于新训练。

dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root: /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root: /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 0

model:
  num_frames: 5
  encoder_channels: [32, 64, 128]
  feature_dim: 128
  rwkv_dim: 192
  rwkv_heads: 6
  rwkv_head_size: 32
  rwkv_blocks: 2
  spatial_size: 2
  branch_channels: 128

train:
  batch_size: 1
  epochs: 60
  lr: 0.0004
  weight_decay: 0.01
  log_interval: 100
  val_interval: 5
  grad_clip: 1.0
  lpips_net: vgg

loss:
  w_branch_N: 0.1
  w_branch_L: 0.1
  w_branch_M: 0.1
  lambda_ortho: 0.01
  w_ssim: 0.0
  branch_warmup_epochs: 5
