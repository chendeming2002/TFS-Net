## v8.5 A 方案 + SGRFv8 分阶段串接融合 (30 epoch)
##
## 相对 configs/v8_5/a_lite_15ep.yaml 的差异: fusion_mode 与训练轮数
## (15 → 30, cosine 调度的 T_max 随之拉长, 因此中间轮次的学习率低于 15ep 版本)
##   additive → sgrf
## SGRFv8 的三条原则:
##   1. 加性串接 y_k = y_{k-1} + s_k·Δ_k, 每段对输出的偏导恒为 s_k (初值 1);
##   2. 级间不做 clamp, 只有最终输出 clamp(0, 1);
##   3. 每段输入是上一段累加结果映回特征空间后加到本段的 TCA 特征上 (N → L → M)。
## 分支频带目标监督保持不变。详见 models/golf_v7r/sgrf_v8.py 与 docs/v8/10-SGRFv8设计.md
seed: 42
output_dir: outputs/v8_5_a_lite_sgrf_30ep
dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root: /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root: /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 6
  pairing: position
  branch_target_kernel_low: 31
  branch_target_kernel_high: 5
  branch_target_motion_share_mid: 0.5
  branch_target_motion_share_high: 0.2
model:
  arch: v8
  num_frames: 5
  encoder_channels:
  - 32
  - 64
  - 128
  encoder_loops: 2
  temporal_loops: 2
  spatial_head: v8
  wkv_mode: single_norm
  channel_mix_rate: 4
  use_omni_shift: true
  use_channel_mix: true
  lowpass_kernel: 9
  branch_blocks: 2
  fusion_mode: sgrf
  fusion_weight_floor: 0.1
  fusion_residual_freeze: true
  branch_m_single_frame: true
  q_mode: cross_rwkv
  summary_type: lite
train:
  batch_size: 2
  epochs: 30
  lr: 0.0005657
  weight_decay: 0.01
  log_interval: 100
  val_interval: 5
  grad_clip: 1.0
  ckpt_interval: 500
  lpips_net: vgg
loss:
  w_branch_N: 0.3
  w_branch_L: 0.3
  w_branch_M: 0.3
  lambda_ortho: 0.01
  w_ssim: 0.0
  branch_warmup_epochs: 5
  use_lowfreq_L: false
  lowfreq_kernel: 16
  branch_specific_targets: true
  branch_target_normalize: true
