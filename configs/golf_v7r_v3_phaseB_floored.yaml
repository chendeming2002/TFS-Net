## Phase B 变体 _floored: 融合算子加权重下限 (§6.16)
##
## 唯一变量 vs golf_v7r_v3_pospair_quick.yaml:
##   model.fusion_mode       = "floored"
##   model.fusion_weight_floor = 0.1
##
## 目的: 修复 softmax 竞争归一化导致的【分支梯度自锁死】。
##   实测 (phaseA_l): w_L=0.0044 → Branch-L 梯度仅为最大路的 1.36%
##   floored: g_k = ε + (1−3ε)·softmax_k  ⇒ ∂Y/∂Y_k = g_k ≥ ε (硬下界)
##
## 受控对照前提 (已单测验证): 两模式【初始输出逐位相同】(均为三分支均值 1/3),
##   故唯一变量是梯度路径; 参数量相同 (3.7509M)。
##
## ⚠️ ε 是待验证超参: 越大越防塌缩, 但越限制门控表达力 (ε→1/3 退化为固定均值)。
##   建议与 0.05 / 0.2 对照消融。
##
## 判据 (⚠️ 本轮已证 ep5 PSNR 方差 ~2.1 dB, 故不用 PSNR 判据):
##   主判据 = 分支梯度占比 (L/最大路) 是否从 1.36% 回到 >30%
##   次判据 = diag_v7r_v3_branches 的 fusion w 是否不再塌缩 (min w 显著 >0.004)
## Phase A 变体 _l: use_lowfreq_L=ON (§6.2-B)
##
## 唯一变量 vs golf_v7r_v3_phaseA.yaml: loss.use_lowfreq_L = true
## 预注册假设 (H-l): Branch-L 只监督低频分量时, 被强信号拉向同一解的压力减小,
##   L-vs-N 输出余弦下降 ≥ 0.02 且 final PSNR 不显著劣化.
## 判据: holdout val PSNR ≥ base - 0.05 dB AND L-vs-N 余弦下降 ≥ 0.02

seed: 42
output_dir: outputs/golf_v7r_v3_phaseB_floored

dataset:
  train_input_root: /home/a1005/yzy/dataset/SDSD/indoor/input
  train_target_root: /home/a1005/yzy/dataset/SDSD/indoor/GT
  val_input_root:   /home/a1005/yzy/dataset/SDSD/test/low-light
  val_target_root:  /home/a1005/yzy/dataset/SDSD/test/GT
  window_size: 5
  crop_size: 256
  num_workers: 0
  pairing: position

model:
  fusion_mode: floored
  fusion_weight_floor: 0.1
  num_frames: 5
  encoder_channels: [32, 64, 128]
  feature_dim: 128
  rwkv_dim: 192
  rwkv_heads: 6
  rwkv_head_size: 32
  rwkv_blocks: 2
  spatial_size: 2
  branch_channels: 128
  motion_aware_diff: false
  diff_smooth_kernel: 5

train:
  batch_size: 1
  epochs: 60
  lr: 0.0004
  weight_decay: 0.01
  log_interval: 100
  val_interval: 5
  grad_clip: 1.0
  lpips_net: vgg

loss:
  w_branch_N: 0.1
  w_branch_L: 0.1
  w_branch_M: 0.1
  lambda_ortho: 0.01
  w_ssim: 0.0
  branch_warmup_epochs: 5
  use_lowfreq_L: false
  lowfreq_kernel: 16
